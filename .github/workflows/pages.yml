name: playground
on:
  push:
    paths: ["rust/**", "lib/**", "playground/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["rust/**", "lib/**", "playground/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: rpy.wasm
        run: cargo build --release --target wasm32-wasip1
        working-directory: rust
      - name: site
        run: |
          mkdir _site
          cp playground/* _site/
          cp rust/target/wasm32-wasip1/release/rpy.wasm _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the examples run
        run: node playground/check.mjs _site/rpy.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # only the default branch is published
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
